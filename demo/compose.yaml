services:
  mysql:
    image: 'mysql:8.4'
    container_name: interview-mysql
    environment:
      - 'MYSQL_DATABASE=interviewdb'
      - 'MYSQL_USER=appuser'
      - 'MYSQL_PASSWORD=apppass'
      - 'MYSQL_ROOT_PASSWORD=rootpass'
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uappuser -papppass || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: 'redis:7'
    container_name: interview-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
