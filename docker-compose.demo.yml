services:
  mysql:
    image: mysql:8.4
    container_name: interview-mysql
    environment:
      MYSQL_DATABASE: interviewdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uappuser -papppass || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: interview-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    container_name: interview-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: interviewdb
      DB_USER: appuser
      DB_PASSWORD: apppass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./demo-fe
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: /api
    container_name: interview-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
